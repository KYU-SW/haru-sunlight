# 깃허브 페이지 배포 — main에 올라오면 자동으로 사이트를 갱신한다.
# 기상청 서비스키는 사이트에 넣지 않는다 — 배포된 사이트는 중계 서버(worker/)로만 받는다.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 기상청 서비스키는 공개 사이트에 넣지 않는다 — config.js는 누구나 열어 볼 수 있다.
      # 배포된 사이트는 항상 중계 서버(worker/, Cloudflare 비밀값에 키 보관)로 받는다.

      # 깃허브 페이지는 파일을 10분 캐시한다(max-age=600). 올릴 때마다 CSS·JS 주소 뒤에
      # 커밋 번호를 붙여, 새로고침하면 브라우저가 옛 파일 대신 새 파일을 받게 한다.
      - name: 캐시 무효화 — CSS·JS 주소에 버전 붙이기
        run: |
          V="${GITHUB_SHA::7}"
          sed -i -E "s#(href=\"css/[^\"?]+\.css)\"#\1?v=$V\"#g; s#(src=\"[^\"?:]+\.js)\"#\1?v=$V\"#g" index.html
          echo "버전 $V 적용:"; grep -c "?v=$V" index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
