<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>타이머 진행 화면 확인</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="app">
  <div class="screen active" id="screen-timer"></div>
  <nav class="tabs">
    <button class="tab" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/></svg><span>홈</span></button>
    <button class="tab on" data-tab="timer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg><span>타이머</span></button>
    <button class="tab" data-tab="weekly"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V11M12 20V4M19 20v-6"/></svg><span>주간</span></button>
    <button class="tab" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/></svg><span>설정</span></button>
  </nav>
</div>
<div class="sheet-bg" id="sheet-bg"><div class="sheet" id="sheet-body"></div></div>
<div id="toast"></div>

<script src="../core/solar.js"></script>
<script src="../core/engine.js"></script>
<script src="../core/store.repo.js"></script>
<script src="../core/kma.geo.js"></script>
<script src="../core/providers/kma.provider.js"></script>
<script src="../core/weather.api.js"></script>
<script src="../shared/ui.js"></script>
<script src="../core/prescription.js"></script>
<script src="../shared/chart.js"></script>
<script src="../shared/notify.js"></script>
<script src="../features/home/home.service.js"></script>
<script src="../features/home/home.view.js"></script>
<script src="../features/timer/timer.service.js"></script>
<script src="../features/timer/timer.view.js"></script>
<script>
/* App 셸 없이 타이머 뷰만 띄운다 (진행 상태 스크린샷용)
   실서비스키가 없어 네트워크 대신 여름 한낮 모의 데이터를 직접 만든다. */
var App = { invalidate: function () {}, refreshView: function () {}, go: function () {},
            prescription: function () { return null; } };

Repo.reset();
Repo.setProfile({ onboarded: true, skinType: 3, clothing: 'shortShort', spf: 1, wakeTime: '07:00' });
var loc = { lat: 37.5665, lon: 126.9780, name: '서울', precise: false };
Repo.setLocation(loc);

function mockWeather() {
  var today = new Date();
  var y = today.getFullYear(), mo = today.getMonth() + 1, d = today.getDate();
  var p2 = function (n) { return n < 10 ? '0' + n : '' + n; };
  var dateKey = y + '-' + p2(mo) + '-' + p2(d);

  var hourly = [];
  for (var h = 0; h < 24; h++) {
    var t = 22 + 6 * Math.max(0, Math.sin((h - 6) / 12 * Math.PI));
    var rh = 60 - 15 * Math.max(0, Math.sin((h - 6) / 12 * Math.PI));
    hourly.push({
      minuteOfDay: h * 60,
      uvi: Math.max(0, 8 * Math.sin((h - 6) / 12 * Math.PI)),
      uviClear: null, tempC: t, rh: rh, feelsLike: null
    });
  }
  return {
    source: 'kma', fetchedAt: Date.now(), dateKey: dateKey,
    utcOffsetSeconds: 9 * 3600, timezone: 'Asia/Seoul',
    lat: loc.lat, lon: loc.lon,
    days: [{ date: dateKey, hourly: hourly, sunrise: dateKey + 'T05:50', sunset: dateKey + 'T19:20' }]
  };
}

var rx = Prescription.forToday(mockWeather(), loc, Repo.getProfile());
TimerService.start(rx, rx.targetWindow || rx.activeWindow);
/* 이미 조금 진행된 상태로 보이게 — 실제 tick 로직을 그대로 태운다 */
var s = TimerService.session();
s.startedAt -= 7 * 60000;
s.elapsedSec = 7 * 60;
s.dose = 0.42;
TimerView.render(rx);
</script>
</body>
</html>
