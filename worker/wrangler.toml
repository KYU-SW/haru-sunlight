# 기상청 API 중계 서버 배포 설정 — 서비스키는 여기 넣지 않는다.
# 키는 `npx wrangler secret put KMA_SERVICE_KEY` 로 Cloudflare 비밀값에만 저장한다.
name = "haru-sunlight-kma"
main = "kma-proxy.js"
compatibility_date = "2025-01-01"

# IP별 요청 횟수 제한 (Cloudflare Workers Rate Limiting) — 1분에 60번.
# 앱은 1시간에 몇 번만 부르므로 정상 사용에는 걸리지 않는다.
# 계정에서 이 기능을 쓸 수 없으면 이 블록을 지워도 된다(코드가 LIMITER 없으면 건너뛴다).
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
